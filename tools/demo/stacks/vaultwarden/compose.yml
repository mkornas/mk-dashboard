services:
  vaultwarden:
    image: vaultwarden/server:1.34.3-alpine
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.home.example
      SIGNUPS_ALLOWED: "false"
    volumes: ["./data:/data"]
    networks: [proxy]
    labels:
      - mk-dashboard.url=https://vault.home.example
      - mk-dashboard.description=Passwords
networks:
  proxy: { external: true }
